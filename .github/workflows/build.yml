name: Rust

on:
  push:
    branches: ["master", "dev", "feature/*"]
  pull_request:
    branches: ["master", "dev"]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v6
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets --features full -- -D warnings
      - name: Build
        run: cargo build --verbose
      - name: Build (full)
        run: cargo build --verbose --features full
      # The user-selectable partial feature sets must at least compile; they
      # have no separate artifacts, so a check is enough.
      - name: Check (tray)
        run: cargo check --features tray
      - name: Check (helper-bin)
        run: cargo check --features helper-bin
      - name: Run tests
        run: cargo test --verbose --features full
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v6
        with:
          name: debug build
          path: |
            target/debug/caffeinate2
            target/debug/caffeinate2-tray
            target/debug/caffeinate2-helper
          if-no-files-found: error
